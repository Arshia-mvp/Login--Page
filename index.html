<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>صفحه ورود / ثبت نام</title>
        <link rel="stylesheet" href="style/style.css">
        <link rel="icon" type="favicon.png" href="./images/28e83674-0038-4572-b069-2940d8292033.png">
    </head>
    <body>
        <main>
            <header>
    <div class="container">
        <div class="card-container">
            <div class="card-left">
                <div class="logo-container">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <h1 class="main-title">سلام دوست من!</h1>
                <p class="description">
                    اینجا صفحه ورود یا ثبت‌نام شماست. <br>
                    با ما، تجربه‌ای امن و سریع خواهید داشت.
                </p>
                <div class="auth-actions">
                    <button class="btn btn-primary">ورود به حساب</button>
                    <button class="btn btn-secondary">ثبت‌نام</button>
                </div>
                <div class="features-section">
                    <p class="features-title">چرا ما؟</p>
                    <ul class="features-list">
                        <a href="#" class="feature-link">ورود سریع و امن</a>
                        <a href="#" class="feature-link">مدیریت آسان حساب کاربری</a>
                        <a href="#" class="feature-link">دسترسی به امکانات ویژه</a>
                    </ul>
                </div>
                <a href="#" class="forgot-password">رمز عبور خود را فراموش کرده‌اید؟</a>
            </div>
            <div class="card-right">
                <div class="logo-container-the-second">
                    <div class="dot-the-second"></div>
                    <div class="dot-the-second"></div>
                    <div class="dot-the-second"></div>
                </div>
                <h2 class="main-title-h2">قسمت ثبت نام کاربری</h2>
                <p class="paragraph-text">اینجا میتوانید اطلاعاتتان را وارد کنید و فرم را پر کنید و شروع به ثبت نام کنید</p>
                <form class="form" action="">
                    <input class="input-name" type="text" placeholder="لطفا اسم و فامیلی خود را وارد کنید :">
                    <input class="input-age" type="number" placeholder="لطفا سن اصلیه خود را وارد کنید :">
                    <input class="input-gmail" type="text" placeholder="لطفا ایمیل یا جیمیل خود را وارد کنید :">
                    <input class="input-password" type="password" placeholder="لطفا یک رمز از خودتان وارد کنید :">
                    <input class="input-submit" type="submit" value="ثبت اطلاعات">
                </form>
            </div>
        </div>
    </div>
            </header>
        </main>
    </body>
</html>
